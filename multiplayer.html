<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESCAPE://SYSTEM - Multiplayer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container multiplayer">
        <header class="game-header">
            <a href="index.html" class="back-link">← Back to Menu</a>
            <h2>ESCAPE://SYSTEM • LOCAL MULTIPLAYER</h2>
        </header>

        <div class="mp-status-bar">
            <div id="player-turn-display" class="player-turn">PLAYER 1'S TURN</div>
            <div class="scores">
                <div class="score-box">
                    <span class="player-label">P1</span>
                    <span id="p1-score" class="score-value">0</span>
                </div>
                <div class="score-box">
                    <span class="player-label">P2</span>
                    <span id="p2-score" class="score-value">0</span>
                </div>
            </div>
            <div id="mp-timer" class="timer">TIME: 00:00</div>
        </div>

        <div class="question-area">
            <p id="mp-question-text" class="question-text"></p>
            <div id="mp-options-container" class="options-container"></div>
        </div>

        <!-- Multiplayer Result Screen -->
        <div id="mp-result-screen" class="result-screen hidden">
            <div class="result-content">
                <h2 id="mp-result-title"></h2>
                <div class="mp-final-scores">
                    <div>Player 1: <span id="mp-final-p1"></span></div>
                    <div>Player 2: <span id="mp-final-p2"></span></div>
                </div>
                <p id="mp-winner"></p>
                <div class="result-buttons">
                    <button id="mp-restart-btn" class="btn-primary">PLAY AGAIN</button>
                    <a href="index.html" class="btn-secondary">MAIN MENU</a>
                </div>
            </div>
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="multiplayer.js"></script>
</body>
</html>
